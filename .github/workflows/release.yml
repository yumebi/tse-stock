name: Release

# master へ push すると、バージョンを1つ上げてタグを打ち、
# Windows と macOS のビルドを正式リリースとして公開する。
#
# タグ push をトリガーに含めていないのは、このワークフロー自身がタグを打つため。
# 含めると同じタグで二重に走る。CI が GITHUB_TOKEN で push したコミットとタグは
# ワークフローを再発火させないので、これで無限ループにもならない。
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン(例: 1.2.4)。空ならpatchを自動インクリメント"
        required: false
        type: string

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Bump version, update all version files, and tag
        id: bump
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e
          if [ -n "$INPUT_VERSION" ]; then
            NEW_VERSION="$INPUT_VERSION"
          else
            git fetch --tags origin
            LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v0.0.0"
            fi
            VERSION_NO_V=${LATEST_TAG#v}
            MAJOR=$(echo "$VERSION_NO_V" | cut -d. -f1)
            MINOR=$(echo "$VERSION_NO_V" | cut -d. -f2)
            PATCH=$(echo "$VERSION_NO_V" | cut -d. -f3)

            # 他のYMBアプリと同じオドメーター式。各桁は0-9で、9の次は繰り上げる
            PATCH=$((PATCH + 1))
            if [ "$PATCH" -gt 9 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi
            if [ "$MINOR" -gt 9 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          NEW_TAG="v$NEW_VERSION"
          echo "新バージョン: $NEW_VERSION"

          python3 .github/scripts/set_version.py "$NEW_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json version.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git diff --cached --quiet || git commit -m "Release $NEW_VERSION [skip ci]"
          git tag -f "$NEW_TAG"
          git push origin master
          git push origin "$NEW_TAG" --force

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          # determine-version が打ったタグを取りに行く。
          # master を見るとバージョンを上げる前の内容でビルドしてしまう。
          ref: ${{ needs.determine-version.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.determine-version.outputs.tag }}
          releaseName: ${{ needs.determine-version.outputs.tag }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}
